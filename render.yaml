services:
  - type: web
    name: researchmind-api
    runtime: python
    plan: free
    buildCommand: >-
      pip install torch --index-url https://download.pytorch.org/whl/cpu
      && pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /api/status
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: WARM_MODELS
        value: "1"
      - key: GEMINI_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
